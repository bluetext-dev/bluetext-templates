name: Curity Couchbase Data Store (JDBC)
description: Configure Curity with Couchbase via a JDBC wrapper that translates SQL to N1QL — fits Curity licenses that allow JDBC data sources; credentials BCrypt-hashed (cost 10)
tags: [auth, curity, couchbase, database, jdbc]
prerequisites:
  - description: Curity service exists
    check: service_exists
    params:
      id: curity
  - description: Couchbase service exists
    check: service_exists
    params:
      id: couchbase
caveats:
  - Overwrites Curity deployment (custom image bundling the Couchbase JDBC wrapper)
  - For licenses that include the Plugin SDK and unrestricted data-source types, prefer auth/curity-couchbase (native plugin)
  - Curity may restart once or twice while Couchbase initializes — this is normal
  - Curity connects as the Couchbase admin user (values catalog couchbase-server-username, default Administrator) with the couchbase-server-password secret — resolved via the couchbase link + the secret store, no hardcoded credentials
  - The curity bucket plus its scopes and collections must already exist before Curity connects. Add a `#[handler]` to a system-shipped api-config bundle at `code/api-config/couchbase/<bundle>/src/lib.rs` (alongside the platform-shipped `base` bundle) that creates the curity bucket and the collections referenced by the JDBC wrapper, then declare the bundle on couchbase's `api-config-bundles:` in `config/system/services/couchbase/service.yaml`. The deploy pipeline runs the api-config Job between store-apply and consumer-apply automatically.
variables:
  - name: deploy_target
    alias: d
    description: '<run-spec-abstract>/<deployment-name> — context for service start/stop/restart steps (e.g. app/development-local)'
    type: deploy-target
    required: true
restarts: [curity]
see_also: [auth/curity-couchbase, auth/curity-oauth, auth/kong-phantom-token]
steps:
  - name: Overwrite Curity deployment (custom image with Couchbase JDBC driver)
    tool: file_write
    params:
      file: config/k8s/curity/curity/base/deployment.yaml
      content_file: files/deployment.yaml
  - name: Write Dockerfile (Curity + pre-built Couchbase JDBC wrapper from GCS)
    tool: file_write
    params:
      file: code/services/curity/Dockerfile
      content_file: files/Dockerfile
  - name: Write datasource config (Couchbase via JDBC)
    tool: file_write
    params:
      file: config/files/curity/curity/datasource.xml
      content_file: files/datasource.xml
  - name: Declare a couchbase link on curity (data-writer profile)
    # The JDBC connection-string resolves $bt{{ config::links.couchbase.host }}
    # against this link at file-config render time; the password resolves via
    # secrets::couchbase-server-password and the username via the values
    # catalog. The link lives on the blueprint, not curity's base service
    # template, so a non-Couchbase curity stack never declares a dangling
    # dependency on an absent couchbase upstream (BP principle 13).
    tool: file_patch
    params:
      file: config/system/services/curity/service.yaml
      operation: merge
      path: ""
      content: |
        links:
          couchbase: couchbase/data-writer
  - name: Restart curity
    tool: service_restart
    params:
      id: curity
      deploy_target: "{{deploy_target}}"
