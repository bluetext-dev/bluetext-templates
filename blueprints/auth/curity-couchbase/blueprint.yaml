name: Curity Couchbase Data Store
description: Configure Curity with Couchbase as a native data source — accounts, tokens, sessions, and credentials (BCrypt-hashed, cost 10) backed by Couchbase via the Curity DAP plugin
tags: [auth, curity, couchbase, database, plugin]
prerequisites:
  - description: Curity service exists
    check: service_exists
    params:
      id: curity
  - description: Couchbase service exists
    check: service_exists
    params:
      id: couchbase
caveats:
  - Overwrites Curity deployment (custom image bundling the Couchbase data-source plugin pulled from gs://bluetext-cli-releases/plugins/)
  - Requires a Curity license that allows custom data-source types (data-sources feature unrestricted, or with "couchbase" listed)
  - The plugin auto-provisions the curity bucket (256 MiB by default), the configured scope, ten curity-* collections, and primary indexes on first connect — no external provisioner needed. Set the data-source's auto-provision field to false for production where the bucket is pre-provisioned and the configured user lacks create privileges
  - For licenses restricted to jdbc data sources, use auth/curity-couchbase-jdbc instead
  - Curity connects as the Couchbase admin user (values catalog couchbase-server-username, default Administrator) with the couchbase-server-password secret — resolved via the couchbase link + the secret store, no hardcoded credentials
variables:
  - name: deploy_target
    alias: d
    description: '<run-spec-abstract>/<deployment-name> — context for service start/stop/restart steps (e.g. app/development-local)'
    type: deploy-target
    required: true
  - name: namespace
    alias: n
    description: Service group within the run-spec-abstract
    type: namespace
    depends_on: deploy_target
    default: main
restarts: [curity]
see_also: [auth/curity-couchbase-jdbc, auth/curity-oauth, auth/kong-phantom-token]
steps:
  - name: Overwrite Curity deployment (custom image with Couchbase plugin)
    tool: file_write
    params:
      file: config/k8s/curity/curity/base/deployment.yaml
      content_file: files/deployment.yaml
  - name: Write Dockerfile (Curity + pre-built Couchbase plugin from GCS)
    tool: file_write
    params:
      file: code/services/curity/Dockerfile
      content_file: files/Dockerfile
  - name: Write datasource config (Couchbase via native plugin)
    tool: file_write
    params:
      file: config/files/curity/curity/datasource.xml
      content_file: files/datasource.xml
  - name: Declare a couchbase link on curity (data-writer profile)
    # datasource.xml resolves $bt{{ config::links.couchbase.host }} against
    # this link at file-config render time; the password resolves via
    # secrets::couchbase-server-password and the username via the values
    # catalog. The link lives on the blueprint, not curity's base service
    # template, so a non-Couchbase curity stack never declares a dangling
    # dependency on an absent couchbase upstream (BP principle 13).
    tool: file_patch
    params:
      file: config/system/services/curity/service.yaml
      operation: merge
      path: ""
      content: |
        links:
          couchbase: couchbase/data-writer
  - name: Restart curity in {{namespace}}
    tool: service_restart
    params:
      id: curity
      deploy_target: "{{deploy_target}}"
