apiVersion: apps/v1
kind: Deployment
metadata:
  name: curity--curity
  annotations:
    # `idsvr -r` reloads etc/init XML and merges with the running config —
    # ConfD-backed dynamic reload, no process restart, no downtime. The
    # file-config reload coupling re-renders the tmpfs before the exec.
    bluetext.io/reload-command: "idsvr -r"
    bluetext.io/reload-watch: config/files/curity/curity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curity--curity
  template:
    metadata:
      labels:
        app: curity--curity
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # The platform injects the `bluetext-render` init container here: it
      # renders config/files/curity/curity/ into the bluetext-file-config
      # tmpfs, substituting the secrets:: placeholders — the license
      # (license/default) and the Couchbase password (datasource.xml) — from
      # the projected per-value-id Secrets. The Couchbase host/username/tls
      # in datasource.xml resolve at file-config render time via
      # config::links.couchbase.* + value::, replacing the old env-var + sed
      # config-templater entirely. (Never write the $bt double-brace
      # placeholder form in a comment — the interpolation pass scans raw
      # manifest text and would try to resolve it.)
      containers:
        - name: curity--curity
          # Custom image: Curity idsvr + the Couchbase data-source plugin
          # (built by this blueprint's Dockerfile from the GCS-hosted plugin).
          image: bluetext-curity:latest
          imagePullPolicy: Never
          command: ["idsvr"]
          args: ["--admin", "-s", "default"]
          env:
            - name: PASSWORD
              value: admin
          ports:
            - containerPort: 8443
              name: runtime
            - containerPort: 6749
              name: admin
          readinessProbe:
            httpGet:
              path: /admin/alive
              port: 6749
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 36
          volumeMounts:
            # Pre-declared so the bluetext-render injection mounts the
            # rendered file-config tmpfs HERE (idsvr's init dir, license
            # nested at license/default) instead of its default
            # /etc/file-config. bluetext-file-config / -template / -secrets
            # volumes are injected by the deploy pipeline.
            - name: bluetext-file-config
              mountPath: /opt/idsvr/etc/init
