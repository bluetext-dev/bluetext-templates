name: Curity HSQLDB Data Store
description: Configure Curity with file-based HSQLDB for accounts, tokens, sessions, and credentials (BCrypt-hashed, cost 10) — persisted in .bluetext/curity-db/
tags: [auth, curity, hsqldb, database]
prerequisites:
  - description: Curity service exists
    check: service_exists
    params:
      id: curity
caveats:
  - Accounts persisted in file-based HSQLDB (survives pod restarts, stored in .bluetext/curity-db/)
  - Default credentials — change for non-dev environments
variables:
  - name: deploy_target
    alias: d
    description: '<run-spec-abstract>/<deployment-name> — context for service start/stop/restart steps (e.g. app/development-local)'
    type: deploy-target
    required: true
  - name: namespace
    alias: n
    description: Service group within the run-spec
    type: namespace
    depends_on: deploy_target
    default: main
restarts: [curity]
see_also: [auth/curity-oauth, auth/curity-couchbase]
steps:
  # HSQLDB is the Curity template's default storage shape — the base
  # manifest ships the schema-init container and the persistence volume.
  # This blueprint only writes the JDBC datasource XML so Curity wires
  # its authn/token services to the same on-disk path.
  - name: Write datasource config (HSQLDB)
    tool: file_write
    params:
      file: config/curity/datasource.xml
      content_file: files/datasource.xml
  # Curity declares `bluetext.io/reload-command: idsvr -r` — a ConfD-backed
  # dynamic reload that re-reads etc/init XML and merges it into the running
  # config with no process restart, no downtime. This blueprint only adds an
  # init-XML fragment (datasource.xml), so reload is the right mechanism;
  # restart would churn the pod for a change reload applies in place.
  - name: Reload curity in {{namespace}}
    tool: service_reload
    params:
      id: curity
      deploy_target: "{{deploy_target}}"
