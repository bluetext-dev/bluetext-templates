name: Curity OAuth2 Configuration
description: Configure Curity with OAuth2 profiles, clients, and scopes
tags: [auth, oidc, oauth, curity]
prerequisites:
  - description: Curity service exists
    check: service_exists
    params:
      id: curity
caveats:
  - Accounts persisted in file-based HSQLDB (survives pod restarts, stored in .bluetext/curity-db/)
  - Pre-configured client — flutter-app (public, PKCE)
  - Create Account link on the login page, or register at curity.<namespace>.bluetext.localhost/authn/registration
variables:
  - name: deploy_target
    alias: d
    description: '<run-spec-abstract>/<deployment-name> — context for service start/stop/restart steps (e.g. app/development-local)'
    type: deploy-target
    required: true
  - name: namespace
    description: Service group within the run-spec
    type: namespace
    depends_on: deploy_target
    default: main
restarts: [curity]
see_also: [auth/kong-phantom-token, auth/curity-couchbase, auth/app-oidc]
steps:
  - name: Write OAuth2 profiles, clients, and scopes configuration
    tool: file_write
    params:
      file: config/curity/oauth-config.xml
      content_file: files/oauth-config.xml
  # Curity declares `bluetext.io/reload-command: idsvr -r` — a ConfD-backed
  # dynamic reload that re-reads etc/init XML and merges it into the running
  # config with no process restart, no downtime. This blueprint only adds an
  # init-XML fragment (oauth-config.xml), so reload is the right mechanism;
  # restart would churn the pod for a change reload applies in place.
  - name: Reload curity in {{namespace}}
    tool: service_reload
    params:
      id: curity
      deploy_target: "{{deploy_target}}"
