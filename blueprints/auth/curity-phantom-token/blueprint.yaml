name: Curity Phantom Token Pattern
description: Deploy Curity + Kong with phantom token introspection to protect target services
tags: [auth, phantom-token, gateway, security]
prerequisites:
  - description: Curity service exists
    check: service_exists
    params:
      id: curity
  - description: Kong service exists
    check: service_exists
    params:
      id: kong
caveats:
  - "Curity license: on a local-dev deploy (a run-spec-variant with default-secrets-allowed) the bundled trial license auto-seeds at deploy time — nothing to set. For other environments, set your own first with `b secret set curity-license-wrapped` (free trial at developer.curity.io)."
  - Kong phantom-token plugin version must match Kong version
  - Adds introspection latency per request (mitigated by token caching)
  - Target services will have their direct Ingress removed (traffic routes through Kong)
  - Default introspection credentials should be changed for non-dev environments
variables:
  - name: deploy_target
    alias: d
    description: '<run-spec-abstract>/<deployment-name> — context for service start/stop/restart steps (e.g. app/development-local)'
    type: deploy-target
    required: true
  - name: namespace
    description: Service-group the protected services live in — resolved (with deploy_target) to the k8s namespace. Scaffolded systems use `main`.
    type: namespace
    depends_on: deploy_target
    default: main
  - name: target_services
    description: Services to protect with phantom tokens
    type: service
    multiple: true
    required: true
see_also: [auth/curity, auth/curity-rbac, gateway/kong-proxy]
steps:
  # The Curity license is delivered by the curity service's own secret
  # mechanism (Vault value-id `curity-license-wrapped`, materialised into the
  # `curity--license` Secret via ESO): on a default-secrets-allowed deploy the
  # bundled trial license auto-seeds, and otherwise `b secret set
  # curity-license-wrapped` sets it. (The old hand-written
  # `config/services/secret.curity.yaml` wrote a `curity-license` Secret that
  # nothing mounted — removed.)
  - name: Create {{namespace}} namespace
    tool: namespace_create
    params:
      id: "{{namespace}}"
  - name: Declare kong link to curity
    # The kong introspection_endpoint addresses curity via config::links
    # (resolved to curity--curity.<ns>.svc:<oidc-interface-port> at file-config
    # render), instead of bare cluster-DNS on the legacy :80 service port.
    # Declaring the link also wires kong→curity into the relationship graph.
    tool: file_patch
    params:
      file: config/system/services/kong/service.yaml
      operation: merge
      path: ""
      content: |
        links:
          curity: curity/oidc
  - name: Write Kong declarative config with phantom-token plugin
    tool: file_write
    params:
      file: config/files/kong/kong/kong.yaml
      content_file: files/kong-declarative.yaml
  - name: Start curity in {{namespace}}
    tool: service_start
    params:
      id: curity
      deploy_target: "{{deploy_target}}"
  - name: Start kong in {{namespace}}
    tool: service_start
    params:
      id: kong
      deploy_target: "{{deploy_target}}"
  - name: Configure target services for phantom token
    for_each: target_services
    steps:
      - name: "Remove direct ingress for {{item}}"
        tool: file_delete
        params:
          file: "config/k8s/{{item}}/{{item}}/base/ingress.yaml"
      - name: "Add gateway annotations to {{item}}"
        tool: file_patch
        params:
          file: "config/k8s/{{item}}/{{item}}/base/deployment.yaml"
          operation: merge
          path: spec.template.metadata.annotations
          content: |
            bluetext.io/gateway: kong
            bluetext.io/phantom-token: "true"
      - name: "Declare kong link to {{item}}"
        # Wires kong→{{item}} into the relationship graph and lets the route
        # below address the upstream via config::links.{{item}} (resolved to
        # the target's interface port at file-config render). A gateway target
        # exposes its app over its `http` connection-profile.
        tool: file_patch
        params:
          file: config/system/services/kong/service.yaml
          operation: merge
          path: ""
          content: |
            links:
              {{item}}: {{item}}/http
      - name: "Add Kong route for {{item}}"
        tool: file_patch
        params:
          file: config/files/kong/kong/kong.yaml
          operation: append_list
          path: services
          content: |
            - name: "{{item}}"
              url: "http://$bt{{ config::links.{{item}}.host }}:$bt{{ config::links.{{item}}.port }}"
              routes:
                - name: "{{item}}-route"
                  paths:
                    - "/{{item}}"
                  strip_path: true
      - name: "Restart {{item}} in {{namespace}}"
        tool: service_restart
        params:
          id: "{{item}}"
          deploy_target: "{{deploy_target}}"
