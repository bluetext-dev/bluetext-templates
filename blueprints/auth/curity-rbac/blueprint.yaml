name: Curity RBAC Stack
description: Full-stack RBAC — Curity (IdP) + Kong (gateway enforcement) + API (service-level role guards); credentials BCrypt-hashed (cost 10)
tags: [auth, oidc, security, gateway, phantom-token, rbac]
prerequisites:
  - description: Curity service exists
    check: service_exists
    params:
      id: curity
  - description: Kong service exists
    check: service_exists
    params:
      id: kong
  - description: API service exists
    check: service_exists
    params:
      id: api
caveats:
  - "Curity license: on a local-dev deploy (a run-spec-variant with default-secrets-allowed) the bundled trial license auto-seeds at deploy time — nothing to set. For other environments, set your own first with `b secret set curity-license-wrapped` (free trial at developer.curity.io)."
  - Uses default admin password "admin" — change for non-dev environments
  - Kong phantom-token plugin validates tokens via introspection (adds latency, mitigated by caching)
  - API trusts the JWT from Kong without signature verification (Kong already validated it)
  - Accounts persisted in file-based HSQLDB (survives pod restarts, stored in .bluetext/curity-db/)
  - Create Account link on the login page, or register at curity.<namespace>.bluetext.localhost/authn/registration
  - Target services will have their direct Ingress removed (traffic routes through Kong)
variables:
  - name: deploy_target
    alias: d
    description: '<run-spec-abstract>/<deployment-name> — context for service start/stop/restart steps (e.g. app/development-local)'
    type: deploy-target
    required: true
  - name: namespace
    description: Service-group the protected services live in — resolved (with deploy_target) to the k8s namespace. Scaffolded systems use `main`; pass another group only if you composed the api into one.
    type: namespace
    depends_on: deploy_target
    default: main
  - name: target_services
    description: Additional services to protect (beyond the api)
    type: service
    multiple: true
    default: ""
see_also: [auth/curity-phantom-token, gateway/kong-proxy]
steps:
  # The Curity license is delivered by the curity service's own secret
  # mechanism (Vault value-id `curity-license-wrapped`, materialised into the
  # `curity--license` Secret via ESO), not by this blueprint: on a
  # default-secrets-allowed deploy the bundled trial license auto-seeds, and
  # for other environments `b secret set curity-license-wrapped` sets it. (The
  # old hand-written `config/services/secret.curity.yaml` wrote a `curity-license`
  # Secret that nothing mounted — removed.)
  - name: Write Curity base configuration with OAuth2 profiles, clients, and scopes
    tool: file_write
    params:
      file: config/curity/base-config.xml
      content_file: files/base-config.xml
  - name: Write Kong declarative config with phantom-token plugin and RBAC route enforcement
    tool: file_write
    params:
      file: config/files/kong/kong/kong.yaml
      content_file: files/kong-rbac.yaml
  - name: Write API with JWT extraction and role-guarded routes
    tool: file_write
    params:
      file: code/services/api/src/main.rs
      content_file: files/api-main.rs
  - name: Write API Cargo.toml with base64 dependency
    tool: file_write
    params:
      file: code/services/api/Cargo.toml
      content_file: files/api-cargo.toml
  - name: Remove direct ingress for api
    tool: file_delete
    params:
      file: config/k8s/api/api/base/ingress.yaml
  - name: Add gateway annotations to api
    tool: file_patch
    params:
      file: config/k8s/api/api/base/deployment.yaml
      operation: merge
      path: spec.template.metadata.annotations
      content: |
        bluetext.io/gateway: kong
        bluetext.io/phantom-token: "true"
  - name: Configure additional target services for phantom token
    for_each: target_services
    steps:
      - name: "Remove direct ingress for {{item}}"
        tool: file_delete
        params:
          file: "config/k8s/{{item}}/{{item}}/base/ingress.yaml"
      - name: "Add gateway annotations to {{item}}"
        tool: file_patch
        params:
          file: "config/k8s/{{item}}/{{item}}/base/deployment.yaml"
          operation: merge
          path: spec.template.metadata.annotations
          content: |
            bluetext.io/gateway: kong
            bluetext.io/phantom-token: "true"
      - name: "Add Kong route for {{item}}"
        tool: file_patch
        params:
          file: config/files/kong/kong/kong.yaml
          operation: append_list
          path: services
          content: |
            - name: "{{item}}"
              url: "http://{{item}}--{{item}}.{{namespace}}.svc.cluster.local"
              routes:
                - name: "{{item}}-route"
                  paths:
                    - "/{{item}}"
                  strip_path: true
      - name: "Restart {{item}} in {{namespace}}"
        tool: service_restart
        params:
          id: "{{item}}"
          deploy_target: "{{deploy_target}}"
  - name: Create {{namespace}} namespace
    tool: namespace_create
    params:
      id: "{{namespace}}"
  - name: Start curity in {{namespace}}
    tool: service_start
    params:
      id: curity
      deploy_target: "{{deploy_target}}"
  - name: Start kong in {{namespace}}
    tool: service_start
    params:
      id: kong
      deploy_target: "{{deploy_target}}"
  - name: Start api in {{namespace}}
    tool: service_start
    params:
      id: api
      deploy_target: "{{deploy_target}}"
