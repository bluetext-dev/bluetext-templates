name: Curity Identity Server
description: Deploy a standalone Curity Identity Server for OAuth 2.0 and OpenID Connect
tags: [auth, oidc, oauth]
prerequisites:
  - description: Curity service exists
    check: service_exists
    params:
      id: curity
caveats:
  - "Curity license: on a local-dev deploy (a run-spec-variant with default-secrets-allowed) the bundled trial license auto-seeds at deploy time — nothing to set. For other environments, set your own first with `b secret set curity-license-wrapped` (free trial at developer.curity.io)."
  - Uses default admin password "admin" — change for non-dev environments
  - Admin UI available at curity-admin.<namespace>.bluetext.localhost
variables:
  - name: deploy_target
    alias: d
    description: '<run-spec-abstract>/<deployment-name> — context for service start/stop/restart steps (e.g. app/development-local)'
    type: deploy-target
    required: true
  - name: namespace
    description: Service-group the curity service lives in — resolved (with deploy_target) to the k8s namespace. Scaffolded systems use `main`.
    type: namespace
    depends_on: deploy_target
    default: main
see_also: [auth/curity-rbac, auth/curity-phantom-token]
steps:
  # The Curity license is delivered by the curity service's own secret
  # mechanism (Vault value-id `curity-license-wrapped`, materialised into the
  # `curity--license` Secret via ESO): on a default-secrets-allowed deploy the
  # bundled trial license auto-seeds, and otherwise `b secret set
  # curity-license-wrapped` sets it. (The old hand-written
  # `config/services/secret.curity.yaml` wrote a `curity-license` Secret that
  # nothing mounted — removed.)
  - name: Create {{namespace}} namespace
    tool: namespace_create
    params:
      id: "{{namespace}}"
  - name: Start curity in {{namespace}}
    tool: service_start
    params:
      id: curity
      deploy_target: "{{deploy_target}}"
