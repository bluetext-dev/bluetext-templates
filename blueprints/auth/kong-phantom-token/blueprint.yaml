name: Kong Phantom Token
description: Configure Kong with phantom token introspection and wire target services through the gateway
tags: [auth, phantom-token, gateway, kong, curity]
prerequisites:
  - description: Curity service exists
    check: service_exists
    params:
      id: curity
  - description: Kong service exists
    check: service_exists
    params:
      id: kong
  - description: Curity OAuth config exists (run auth/curity-oauth first)
    check: file_exists
    params:
      file: config/files/curity/curity/oauth-config.xml
caveats:
  - Adds introspection latency per request (mitigated by 300s token caching)
  - Target services will have their direct Ingress removed (traffic routes through Kong)
  - Default introspection credentials (phantom-token-client / phantom-token-secret) — change for non-dev environments
variables:
  - name: deploy_target
    alias: d
    description: '<run-spec-abstract>/<deployment-name> — context for service start/stop/restart steps (e.g. app/development-local)'
    type: deploy-target
    required: true
  - name: namespace
    description: Service group within the run-spec-abstract
    type: namespace
    depends_on: deploy_target
    default: main
  - name: targets
    description: Services to protect with phantom tokens
    type: service
    multiple: true
    required: true
restarts: [curity, kong]
see_also: [auth/curity-oauth, auth/api-rbac]
steps:
  - name: Write phantom-token client definition for Curity
    tool: file_write
    params:
      file: config/files/curity/curity/phantom-token-client.xml
      content_file: files/phantom-token-client.xml
  - name: Declare kong links to curity and web-app
    # The kong routes below address these upstreams via config::links (resolved
    # to <svc>--<svc>.<ns>.svc:<interface-port> at file-config render), instead
    # of bare cluster-DNS on the legacy :80 service port. Declaring the links
    # also wires kong→curity / kong→web-app into the relationship graph. The
    # per-target kong→<target> edges are declared in the for_each loop below.
    tool: file_patch
    params:
      file: config/system/services/kong/service.yaml
      operation: merge
      path: ""
      content: |
        links:
          curity: curity/oidc
          web-app: web-app/http
  - name: Write Kong declarative config with phantom-token plugin
    tool: file_write
    params:
      file: config/files/kong/kong/kong.yaml
      content_file: files/kong-declarative.yaml
  - name: Restart curity in {{namespace}}
    tool: service_restart
    params:
      id: curity
      deploy_target: "{{deploy_target}}"
  - name: Reload kong in {{namespace}}
    tool: service_reload
    params:
      id: kong
      deploy_target: "{{deploy_target}}"
  - name: Configure target services for phantom token
    for_each: targets
    steps:
      - name: "Remove direct ingress for {{item}}"
        tool: file_delete
        params:
          file: "config/k8s/{{item}}/{{item}}/base/ingress.yaml"
      - name: "Add gateway annotations to {{item}}"
        tool: file_patch
        params:
          file: "config/k8s/{{item}}/{{item}}/base/deployment.yaml"
          operation: merge
          path: spec.template.metadata.annotations
          content: |
            bluetext.io/gateway: kong
            bluetext.io/phantom-token: "true"
      - name: "Declare kong link to {{item}}"
        # Wires kong→{{item}} into the relationship graph and lets the route
        # below address the upstream via config::links.{{item}} (resolved to
        # the target's interface port at file-config render). A phantom-token
        # target exposes its app over its `http` connection-profile.
        tool: file_patch
        params:
          file: config/system/services/kong/service.yaml
          operation: merge
          path: ""
          content: |
            links:
              {{item}}: {{item}}/http
      - name: "Add Kong route for {{item}}"
        tool: file_patch
        params:
          file: config/files/kong/kong/kong.yaml
          operation: append_list
          path: services
          # Service-scoped phantom-token plugin — guards ONLY this
          # protected target. NOT a global/top-level plugin: that would
          # also 401 the public SPA (`/`) and Curity token endpoint
          # (`/curity`), breaking the login flow before it can mint a token.
          content: |
            - name: "{{item}}"
              url: "http://$bt{{ config::links.{{item}}.host }}:$bt{{ config::links.{{item}}.port }}"
              routes:
                - name: "{{item}}-route"
                  paths:
                    - "/{{item}}"
                  strip_path: true
              plugins:
                - name: phantom-token
                  config:
                    introspection_endpoint: http://$bt{{ config::links.curity.host }}:$bt{{ config::links.curity.port }}/oauth/v2/oauth-introspect
                    client_id: phantom-token-client
                    client_secret: phantom-token-secret
                    token_cache_seconds: 300
      - name: "Restart {{item}} in {{namespace}}"
        tool: service_restart
        params:
          id: "{{item}}"
          deploy_target: "{{deploy_target}}"
