_format_version: "3.0"
services:
  # Phantom-token is the same-origin front door. The browser holds an
  # opaque access token; for that to ride along on `/api` requests so the
  # plugin can introspect it (opaque → JWT) and forward to the API, the
  # caller and the API MUST share one origin. Kong is therefore the single
  # ingress host: `/api` (protected) and `/curity` (the browser's OIDC token
  # POST) live under Kong's one tokenized host. `targets`-protected `/api/*`
  # routes are appended below by the blueprint's for_each loop, each carrying
  # a SERVICE-SCOPED phantom-token plugin. A web-app SPA front door (the `/`
  # catch-all serving the Vite app) is web-app-specific and is added by
  # auth/web-app-oidc — not here — so a non-web-app stack (e.g. a Flutter
  # client) never declares a link to an absent web-app upstream.
  #
  # The plugin is deliberately NOT declared as a top-level (global)
  # `plugins:` entry: a global plugin in Kong's declarative config binds
  # to EVERY service/route, so it would also guard `/curity` — 401ing the
  # OIDC token exchange that the login flow depends on. Scoping it to each
  # protected target's `plugins:` block is what keeps the public front door
  # (Curity token endpoint) open.
  #
  # Curity token-exchange passthrough. The web-app's PKCE token POST is a
  # browser `fetch` — it must be same-origin, so it goes to Kong at
  # `/curity/*` and Kong strips the prefix and forwards to Curity's OIDC
  # runtime. The upstream is addressed via config::links.curity (resolved at
  # file-config render to curity--curity.<ns>.svc:<oidc-interface-port>), and
  # the runtime service-role is configured `<protocol>http</protocol>` (see
  # the curity base-config.xml), so the in-cluster hop is plain HTTP on the
  # oidc interface port — the same upstream the phantom-token
  # introspection_endpoint below addresses. NO phantom-token plugin here: this
  # is the unauthenticated token endpoint that MINTS the token. The OIDC
  # *authorize* request is a full-page redirect straight to Curity's own host
  # (a separate origin by OIDC design), so it does not pass through Kong.
  # jwks/userinfo are never fetched by the browser (the SPA decodes the JWT
  # client-side), so only the token endpoint is routed here. No service-scoped
  # plugin → public.
  - name: curity-oidc
    url: "http://$bt{{ config::links.curity.host }}:$bt{{ config::links.curity.port }}"
    routes:
      - name: curity-oidc-route
        paths:
          - "/curity"
        strip_path: true
