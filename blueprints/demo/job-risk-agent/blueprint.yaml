name: Job training risk assessment agent (workshop scaffold)
description: >-
  Scaffolds the job-risk-agent workshop into the system: drops a
  `prompts.md` at the system root describing the task participants build,
  replaces the system `CLAUDE.md` with a workshop reference card (RAG MCP
  handshake, OpenRouter, JobTech, Axum SSE notes), and overwrites the api
  Cargo.toml with streaming-ready deps (reqwest rustls, tokio-stream,
  tower-http cors, etc.).
tags: [workshop, demo, sse, rag]

prerequisites:
  - description: api service exists
    check: service_exists
    params:
      id: "{{api_service}}"
  - description: web-app service exists
    check: service_exists
    params:
      id: "{{web_service}}"

caveats:
  - Overwrites `<system>/CLAUDE.md` and `code/services/<api>/Cargo.toml`. If you have local edits to either, commit first.
  - Workshop credentials (RAG token, hard-coded keys) are embedded in the scaffolded files. Treat the workshop system as throwaway.

variables:
  - name: api_service
    alias: a
    description: Rust axum api service the workshop builds on.
    type: service
    accepts: [api]
    default: api
  - name: web_service
    alias: w
    description: Web-app service that hosts the assessor UI.
    type: service
    accepts: [web-app]
    default: web-app

steps:
  - name: Write workshop task description to system root prompts.md
    tool: file_write
    params:
      file: prompts.md
      content_file: files/prompts.md

  - name: Replace system CLAUDE.md with workshop reference card
    tool: file_write
    params:
      file: CLAUDE.md
      content_file: files/CLAUDE.md

  - name: Overwrite api Cargo.toml with streaming-ready deps
    tool: file_write
    params:
      file: code/services/{{api_service}}/Cargo.toml
      content_file: files/api/Cargo.toml
