name: Items CRUD round-trip (api + web-app + Couchbase)
description: >-
  Materializes an `Item` entity in the project's modeling layer — state
  machine, mutation, getter, command, and state invariant — then wires a
  thin axum controller in the api service and a matching form + list in
  the web-app home page. Respects the system's dev modes: with the
  scaffold's default mirrord entry the api compiles incrementally on the
  host, and the deploy prints the `b wait service` command that blocks
  until it serves. Demonstrates a full frontend → API → datastore
  round-trip that follows the platform's modeling architecture
  (docs/MODELING.md).
tags: [fullstack, api, couchbase, crud, demo]

prerequisites:
  - description: api service exists
    check: service_exists
    params:
      id: "{{api_service}}"
  - description: web-app service exists
    check: service_exists
    params:
      id: "{{web_service}}"
  - description: Upstream Couchbase exists
    check: upstream_exists
    params:
      id: "{{upstream_couchbase}}"

caveats:
  - Overwrites the project's `model/` crate (lib.rs, items.rs, Cargo.toml) to define the Item state machine. Existing model content is replaced.
  - With the api in a host-side dev mode (the scaffold default is mirrord), the deploy spawns the host process and prints a `b wait service {{api_service}} -d <target>` command — run it to block until the api serves. With the api in-cluster (no dev-modes entry), the deploy rebuilds the api base image instead; the first build can take a few minutes.
  - The api ingress returns 502 until the api serves (readiness probe in-cluster, host process under a dev mode). Polling the ingress is fine.
  - Couchbase must already be initialized with the {{bucket}} bucket before running this blueprint. The couchbase api-config bundle (`config/api/couchbase/<bundle>/` + `code/api-config/couchbase/<bundle>/`) handles bucket setup at deploy time.

variables:
  - name: deploy_target
    alias: d
    description: '<run-spec-abstract>/<deployment-name> — owns the api deployment for the follow-up build + apply (e.g. app/development-local)'
    type: deploy-target
    required: true
  - name: api_service
    alias: a
    description: Rust axum api service to extend with POST /items.
    type: service
    accepts: [api]
    default: api
  - name: web_service
    alias: w
    description: Web-app service to extend with the items form.
    type: service
    accepts: [web-app]
    default: web-app
  - name: upstream_couchbase
    alias: u
    description: Couchbase service to persist items into.
    type: upstream
    accepts: [couchbase]
    default: couchbase
  - name: bucket
    alias: b
    description: Couchbase bucket to store items in. Provisioned by the api-config bundle at deploy time.
    type: string
    default: main

restarts: [api, web-app]

steps:
  # Wire api → couchbase/data-writer as a link entry. The deploy
  # pipeline auto-mounts the couchbase variant's `auth` secret +
  # endpoint metadata at /etc/bluetext/links/database/ in the api pod
  # (PROPOSAL §D4: file-mount only, no env-var injection).
  - name: Add `database` link from {{api_service}} to {{upstream_couchbase}}/data-writer
    tool: file_patch
    params:
      file: config/system/services/{{api_service}}/service.yaml
      operation: merge
      path: ""
      content: |
        links:
          database: {{upstream_couchbase}}/data-writer

  # ─── Modeling layer ─────────────────────────────────────────────────
  # The Item entity, its mutation/getter/command, and the state invariant
  # live in the shared `model/` crate so both production and simulation
  # run the exact same code.

  - name: Write model crate manifest (enables couchbase feature)
    tool: file_write
    params:
      file: model/Cargo.toml
      content_file: files/model/Cargo.toml

  - name: Write model state machine (AppState + connect + simulation hooks)
    tool: file_write
    params:
      file: model/src/lib.rs
      content_file: files/model/src/lib.rs

  - name: Write Item entity — mutation, getter, command, state invariant
    tool: file_write
    params:
      file: model/src/items.rs
      content_file: files/model/src/items.rs

  - name: Write model simulation entry point
    tool: file_write
    params:
      file: model/src/main.rs
      content_file: files/model/src/main.rs

  # ─── Controller layer ───────────────────────────────────────────────
  # axum handlers that each call exactly one command on AppState.

  - name: Replace api main.rs with thin controllers (one endpoint = one command)
    tool: file_write
    params:
      file: code/services/{{api_service}}/src/main.rs
      content_file: files/api/src/main.rs

  - name: Replace api Cargo.toml (pulls in models with couchbase feature)
    tool: file_write
    params:
      file: code/services/{{api_service}}/Cargo.toml
      content_file: files/api/Cargo.toml

  # ─── Frontend ───────────────────────────────────────────────────────

  - name: Replace web-app home.tsx with items form + list
    tool: file_write
    params:
      file: code/services/{{web_service}}/app/routes/home.tsx
      content_file: files/web/home.tsx

  # Dev modes stay untouched: which substrate compiles the api —
  # host process under mirrord (the scaffold default, incremental
  # builds) or the in-cluster image — is the developer's choice in
  # config/system/dev-modes.yaml, and a demo blueprint configures the
  # demo, not the development workflow. The deploy step handles both:
  # host-side modes get spawned + a printed `b wait service` command,
  # in-cluster gets the image build.

  # Provision the `items` collection the model writes into. Each entity gets its
  # own named collection (model uses `#[store(collection = "items")]`); the
  # api-config job converges this state.yaml at deploy time and creates it. When
  # adapting to a second entity, add its collection here too.
  - name: Provision the Couchbase `items` collection (api-config state.yaml)
    tool: file_write
    params:
      file: config/api/{{upstream_couchbase}}/base/state.yaml
      content_file: files/api-config/couchbase-state.yaml

  # Full-target deploy, NOT `only: api` — on a fresh system nothing else is
  # running yet, and an api-only deploy leaves the pod waiting on a Couchbase
  # that never comes (0/1 ready for the whole 600s rollout timeout). The full
  # deploy brings the datastore + web-app up too, and its secrets preflight
  # fails fast with the exact `b secret set` commands when credentials are
  # missing, instead of hanging.
  - name: Deploy the full target (api + web-app + couchbase) so the new model takes effect
    tool: deploy
    params:
      deploy_target: "{{deploy_target}}"
