name: Entity CRUD round-trip (api + web-app + Couchbase)
description: >-
  Materializes a CRUD entity in the project's modeling layer — state
  machine, mutation, getter, command, and state invariant — then wires a
  thin axum controller in the api service and a matching form + list in
  the web-app home page. The entity is a variable: pass your domain type
  directly (`-v entity=HighScore -v entity_snake=highscore -v
  collection=highscores`) and the generated model, routes, collection,
  and frontend carry it from the start — no rename pass afterwards; only
  the entity's fields and logic remain to adapt. Defaults produce the
  classic `Item` demo. This blueprint scaffolds config + code only and
  makes no cluster changes; after it completes, run `b deploy
  <run-spec-abstract>/<deploy-name>` to build the images and bring the new
  model live. Demonstrates a full
  frontend → API → datastore round-trip that follows the platform's
  modeling architecture (docs/MODELING.md).
tags: [fullstack, api, couchbase, crud, demo]

prerequisites:
  - description: api service exists
    check: service_exists
    params:
      id: "{{api_service}}"
  - description: web-app service exists
    check: service_exists
    params:
      id: "{{web_service}}"
  - description: Upstream Couchbase exists
    check: upstream_exists
    params:
      id: "{{upstream_couchbase}}"

caveats:
  - Overwrites the project's `model/` crate (lib.rs, {{collection}}.rs, Cargo.toml) to define the {{entity}} state machine. Existing model content is replaced.
  - This blueprint does not deploy — run `b deploy <run-spec-abstract>/<deploy-name>` afterward. With the api in a host-side dev mode (the scaffold default is mirrord), that deploy spawns the host process and blocks until it serves (the wait extends through a cold compile while the process is alive); with the api in-cluster (no dev-modes entry), it rebuilds the api base image instead, and the first build can take a few minutes.
  - The `entity` / `entity_snake` / `collection` variables must be coherent, valid Rust identifiers (CamelCase type, snake_case singular, snake_case plural) — they name the struct, the functions, the module file, the Couchbase collection, and the HTTP route.
  - Couchbase must already be initialized with the {{bucket}} bucket before running this blueprint. The couchbase api-config bundle (`config/api/couchbase/<bundle>/` + `code/api-config/couchbase/<bundle>/`) handles bucket setup at deploy time.

variables:
  - name: api_service
    alias: a
    description: Rust axum api service carrying the entity's controllers (list, create, get-one).
    type: service
    accepts: [api]
    default: api
  - name: web_service
    alias: w
    description: Web-app service to extend with the items form.
    type: service
    accepts: [web-app]
    default: web-app
  - name: upstream_couchbase
    alias: u
    description: Couchbase service to persist items into.
    type: upstream
    accepts: [couchbase]
    default: couchbase
  - name: bucket
    alias: b
    description: Couchbase bucket to store the entity in. Provisioned by the api-config bundle at deploy time.
    type: string
    default: main
  - name: entity
    alias: e
    description: 'Domain type name (CamelCase Rust identifier) the scaffold materializes — pass your real entity (e.g. HighScore) so no rename pass is needed afterwards. Keep entity_snake and collection coherent with it.'
    type: string
    default: Item
  - name: entity_snake
    alias: s
    description: 'snake_case singular of `entity` (e.g. highscore) — names the create/get/submit functions.'
    type: string
    default: item
  - name: collection
    alias: c
    description: 'snake_case plural of `entity` (e.g. highscores) — names the model module file, the Couchbase collection, the list commands, and the HTTP route (/<collection>).'
    type: string
    default: items

restarts: [api, web-app]

steps:
  # Wire api → couchbase/data-writer as a link entry. The deploy
  # pipeline auto-mounts the couchbase variant's `auth` secret +
  # endpoint metadata at /etc/bluetext/links/database/ in the api pod
  # (PROPOSAL §D4: file-mount only, no env-var injection).
  - name: Add `database` link from {{api_service}} to {{upstream_couchbase}}/data-writer
    tool: file_patch
    params:
      file: config/system/services/{{api_service}}/service.yaml
      operation: merge
      path: ""
      content: |
        links:
          database: {{upstream_couchbase}}/data-writer

  # Wire web-app → api as a declared link too. The browser can't use the
  # mount's in-cluster host/port, but the link ConfigMap also carries
  # `ingress-url` — the api's PUBLIC URL — which home.tsx's server-side
  # loader reads from /etc/bluetext/links/api/ and hands to the client.
  # The frontend's dependency on the api is thereby visible in the link
  # graph (snapshot, wiring-gap analysis) instead of living as a
  # hostname convention inside app code.
  - name: Add `api` link from {{web_service}} to {{api_service}}/http
    tool: file_patch
    params:
      file: config/system/services/{{web_service}}/service.yaml
      operation: merge
      path: ""
      content: |
        links:
          api: {{api_service}}/http

  # ─── Modeling layer ─────────────────────────────────────────────────
  # The Item entity, its mutation/getter/command, and the state invariant
  # live in the shared `model/` crate so both production and simulation
  # run the exact same code.

  - name: Write model crate manifest (enables couchbase feature)
    tool: file_write
    params:
      file: model/Cargo.toml
      content_file: files/model/Cargo.toml

  - name: Write model state machine (AppState + connect + simulation hooks)
    tool: file_write
    params:
      file: model/src/lib.rs
      content_file: files/model/src/lib.rs

  - name: Write {{entity}} entity — mutation, getter, command, state invariant
    tool: file_write
    params:
      file: model/src/{{collection}}.rs
      content_file: files/model/src/entity.rs

  - name: Write model simulation entry point
    tool: file_write
    params:
      file: model/src/main.rs
      content_file: files/model/src/main.rs

  # ─── Controller layer ───────────────────────────────────────────────
  # axum handlers that each call exactly one command on AppState.

  - name: Replace api main.rs with thin controllers (one endpoint = one command)
    tool: file_write
    params:
      file: code/services/{{api_service}}/src/main.rs
      content_file: files/api/src/main.rs

  - name: Replace api Cargo.toml (pulls in models with couchbase feature)
    tool: file_write
    params:
      file: code/services/{{api_service}}/Cargo.toml
      content_file: files/api/Cargo.toml

  # ─── Frontend ───────────────────────────────────────────────────────

  - name: Replace web-app home.tsx with {{entity}} form + list
    tool: file_write
    params:
      file: code/services/{{web_service}}/app/routes/home.tsx
      content_file: files/web/home.tsx

  # Dev modes stay untouched: which substrate compiles the api —
  # host process under mirrord (the scaffold default, incremental
  # builds) or the in-cluster image — is the developer's choice in
  # config/system/dev-modes.yaml, and a demo blueprint configures the
  # demo, not the development workflow. The deploy step handles both:
  # host-side modes get spawned + blocked on until they serve,
  # in-cluster gets the image build.

  # Provision the collection the model writes into. Each entity gets its
  # own named collection (model uses `#[store(collection = "{{collection}}")]`);
  # the api-config job converges this state.yaml at deploy time and creates it.
  # When adapting to a second entity, add its collection here too.
  - name: Provision the Couchbase `{{collection}}` collection (api-config state.yaml)
    tool: file_write
    params:
      file: config/api/{{upstream_couchbase}}/base/state.yaml
      content_file: files/api-config/couchbase-state.yaml

  # No deploy step: this blueprint scaffolds config + code only and leaves the
  # system on a clean `main`. Deploying is a separate concern (`b deploy`) — it
  # is slow, cluster-dependent, and non-transactional, so folding it into the
  # blueprint's branch-and-rollback transaction meant a deploy/cluster failure
  # would roll back perfectly-good scaffolding (and read like a blueprint bug).
  # Run `b deploy <run-spec-abstract>/<deploy-name>` after this completes to
  # build the images and bring the new model live; its secret preflight will
  # name any missing `b secret set` credentials, and the api-config Job
  # provisions the `{{collection}}` collection from the state.yaml above.
