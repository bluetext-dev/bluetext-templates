[package]
name = "api"
version = "0.1.0"
edition = "2021"

# Empty [workspace] table makes this service its own workspace root (same
# guard the scaffolded api ships). Systems sit under ancestors that carry a
# Cargo workspace (the bluetext dev checkout, or a system-level workspace);
# without this, host-side cargo (cargo check, the mirrord dev loop) walks up,
# gets claimed by that workspace, and errors with "current package believes
# it's in a workspace when it's not".
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
models = { path = "../../../model", features = ["couchbase"] }
