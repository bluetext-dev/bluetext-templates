name: Kong AI MCP Proxy
description: Expose an HTTP API's endpoints as MCP tools via the Kong ai-mcp-proxy plugin (Kong Enterprise 3.12+ required)
tags: [gateway, kong]
prerequisites:
  - description: Kong (Enterprise) service exists
    check: service_exists
    params:
      id: "{{gateway}}"
  - description: Target API service exists
    check: service_exists
    params:
      id: "{{target}}"
variables:
  - name: deploy_target
    alias: d
    description: '<run-spec-abstract>/<deployment-name> — context for service start/stop/restart steps (e.g. app/development-local)'
    type: deploy-target
    required: true
  - name: gateway
    alias: g
    description: Kong service to configure. Must be Kong Enterprise 3.12+ (the ai-mcp-proxy plugin is an EE-only tier)
    type: service
    default: kong-enterprise
  - name: target
    alias: t
    description: Backend service whose HTTP endpoints become MCP tools (e.g. api)
    type: service
    required: true
  - name: namespace
    alias: n
    description: Service group within the run-spec-abstract
    type: namespace
    depends_on: deploy_target
    default: main
steps:
  - name: "Declare {{gateway}} link to {{target}}"
    # The target service route below addresses the upstream via config::links
    # (resolved to {{target}}--{{target}}.<ns>.svc:<interface-port> at file-config
    # render), instead of a bare short-name on the legacy :80 service port.
    # Declaring the link also wires {{gateway}}→{{target}} into the relationship
    # graph. A backend target exposes its app over its `http` connection-profile.
    tool: file_patch
    params:
      file: config/system/services/{{gateway}}/service.yaml
      operation: merge
      path: ""
      content: |
        links:
          {{target}}: {{target}}/http
  - name: Write Kong declarative config with MCP proxy plugin
    tool: file_write
    params:
      file: "config/files/{{gateway}}/{{gateway}}/kong.yaml"
      content_file: files/kong-declarative.yaml
  - name: "Reload {{gateway}}"
    tool: service_reload
    params:
      id: "{{gateway}}"
      deploy_target: "{{deploy_target}}"
