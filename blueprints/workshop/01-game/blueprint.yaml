name: Workshop step 1 — web-app game
description: >-
  Scaffolds `prompts/01-game.md` at the system root. The participant
  uses pi to replace the default home page with a small browser game.
  No api work in this step.
tags: [workshop, web-app]

prerequisites:
  - description: web-app service exists
    check: service_exists
    params:
      id: "{{web_service}}"

variables:
  - name: web_service
    alias: w
    description: Web-app service that hosts the game.
    type: service
    accepts: [web-app]
    default: web-app

steps:
  - name: Write step-1 prompt to prompts/01-game.md
    tool: file_write
    params:
      file: prompts/01-game.md
      content_file: files/prompts/01-game.md
