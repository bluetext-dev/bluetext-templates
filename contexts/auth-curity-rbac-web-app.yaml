name: RBAC Auth with Curity (web-app)
description: Full authentication stack with role-based access control for the web-app — Curity (IdP) + Kong (gateway enforcement) + API (service-level role guards) + web-app (browser OIDC login with PKCE).
variables:
  - name: run_spec
    description: "Run-spec-abstract to compose these services into. Pick `default` to add them to the system's existing default run-spec instead of a dedicated one."
    type: string
    default: rbac
    options:
      - rbac
      - default
caveats:
  - "On a local-dev deploy (a run-spec-variant with `default-secrets-allowed: true`) Curity's secrets auto-populate at deploy time — the license seeds from the bundled trial demo (Non-Production tier; replace with your own from developer.curity.io before production), the admin password is auto-generated (Reveal it in the secrets UI), and the admin username is the `admin` values-catalog entry. No manual secret step or $CURITY_LICENSE_KEY export needed."
  - Kong adds introspection latency per request (mitigated by 300s token caching).
  - The API trusts the JWT from Kong without signature verification (Kong already validated it).
  - Tokens land in browser localStorage. Fine for a local demo; revisit before going to production.
tips:
  - "Create users: b bp run auth/curity-create-users --var users=alice:Pass1,bob:Pass2"
  - "Assign roles: b bp run auth/curity-assign-roles --var users=alice:admin,bob:moderator"
  - "Open the UI at KONG's host (printed under `Reachable at:` by the deploy) — Kong is the single front door serving the SPA at `/`, the API at `/api`, and the OIDC token POST at `/curity`. The web-app has no host of its own; phantom token requires same-origin."
pitfalls:
  - Don't skip auth/curity-oauth — phantom-token needs the introspect endpoint configured.
  - The API AND the web-app route through Kong's single host — direct ingress for both is removed (phantom token requires same-origin). The web-app is reachable only via Kong's `/` catch-all.
  - Curity issues a session cookie. To switch users in a browser, sign out (or clear cookies for curity.<ns>.bluetext.localhost).
steps:
  - run: b service add curity --if-missing
    description: Add the Curity Identity Server abstract (skipped if already present)
  - run: b service add kong --if-missing
    description: Add the Kong API Gateway (skipped if already present)
  - run: b service add api --if-missing
    description: Add the API service (skipped if already present — this context layers auth onto an existing app too)
  - run: b service add web-app --if-missing
    description: Add the web-app service (skipped if already present)
  - run: b run-spec-abstract set {{run_spec}} -s curity,kong,api,web-app
    description: Compose the four services into a single run-spec-abstract
  - run: b run-spec-abstract deploy add {{run_spec}} development-local -v development -c k3d-local
    description: Add the development-local deployment pairing run-spec-variant `development` with the k3d-local cluster
  - run: b bp run auth/curity-hsqldb --no-restart --var deploy_target={{run_spec}}/development-local
    description: Configure HSQLDB as the data store
  - run: b bp run auth/curity-oauth --no-restart --var deploy_target={{run_spec}}/development-local
    description: Configure OAuth2 profiles, scopes, and the flutter-app client
  - run: b bp run auth/kong-phantom-token --var targets=api --no-restart --var deploy_target={{run_spec}}/development-local
    description: Configure Kong with phantom token introspection, route API traffic through it
  - run: b bp run auth/api-rbac --no-restart --var deploy_target={{run_spec}}/development-local
    description: Add role-guarded routes, SCIM user management profile, and claims mapper
  - run: b bp run auth/web-app-oidc --no-restart --var deploy_target={{run_spec}}/development-local
    description: Register the web-app Curity client (redirect-uri on Kong's tokenized host) and add the React auth provider. The SPA, /api, and the /curity token POST are all same-origin behind Kong — no Vite proxies.
  - run: b deploy {{run_spec}}/development-local
    description: Render manifests, build images, and apply the run-spec-abstract to the local cluster
  - run: b service restart web-app -d {{run_spec}}/development-local
    description: Restart web-app so its Vite dev server re-reads routes.ts — React Router 7 framework mode builds the route manifest once at process boot, so the auth/callback route the web-app-oidc blueprint added needs a fresh process (a re-deploy with unchanged Deployment spec won't roll the pod on its own)
  - run: b bp run auth/curity-create-users --var users=alice:Password1,bob:Password1 --var deploy_target={{run_spec}}/development-local
    description: Create test user accounts with passwords
  - run: b bp run auth/curity-assign-roles --var users=alice:admin,bob:moderator --var deploy_target={{run_spec}}/development-local
    description: Assign roles to the test users
