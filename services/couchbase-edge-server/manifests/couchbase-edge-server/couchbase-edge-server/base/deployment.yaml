apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchbase-edge-server--couchbase-edge-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: couchbase-edge-server--couchbase-edge-server
  template:
    metadata:
      labels:
        app: couchbase-edge-server--couchbase-edge-server
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # The platform injects the `bluetext-render` init container here: it
      # renders config/files/couchbase-edge-server/couchbase-edge-server/
      # (config.json, with $bt{{ deploy::namespace }} resolved at render time)
      # into the bluetext-file-config tmpfs, replacing the old config-templater
      # sed + config-template hostPath. (Never write the $bt double-brace
      # placeholder form in a comment — the interpolation pass scans raw
      # manifest text and would try to resolve it.)
      containers:
        - name: couchbase-edge-server--couchbase-edge-server
          image: couchbase/edge-server:latest
          command: ["couchbase-edge-server"]
          args: ["--verbose", "/etc/edge-server/config.json"]
          ports:
            - containerPort: 59840
              name: public
          readinessProbe:
            httpGet:
              path: /
              port: 59840
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            # Pre-declared (name bluetext-file-config) so the render injection
            # mounts the rendered config.json HERE via subPath instead of its
            # default /etc/file-config; the bluetext-file-config (tmpfs) +
            # bluetext-file-config-template (ConfigMap) volumes are injected.
            - name: bluetext-file-config
              mountPath: /etc/edge-server/config.json
              subPath: config.json
