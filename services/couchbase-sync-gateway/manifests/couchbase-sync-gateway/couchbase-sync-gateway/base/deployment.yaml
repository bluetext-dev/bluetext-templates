apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchbase-sync-gateway--couchbase-sync-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: couchbase-sync-gateway--couchbase-sync-gateway
  template:
    metadata:
      labels:
        app: couchbase-sync-gateway--couchbase-sync-gateway
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # The platform injects the `bluetext-render` init container here: it
      # renders config/files/couchbase-sync-gateway/couchbase-sync-gateway/
      # (config.json, with $bt{{ deploy::namespace }} resolved at render time)
      # into the bluetext-file-config tmpfs, replacing the old config-templater
      # sed + config-template hostPath. (Never write the $bt double-brace
      # placeholder form in a comment — the interpolation pass scans raw
      # manifest text and would try to resolve it.)
      containers:
        - name: couchbase-sync-gateway--couchbase-sync-gateway
          image: couchbase/sync-gateway:3.1.1-enterprise
          args:
            - "-bootstrap.use_tls_server=false"
            - "/etc/sync_gateway/config.json"
          ports:
            - containerPort: 4984
              name: public
            - containerPort: 4985
              name: admin
          readinessProbe:
            httpGet:
              path: /
              port: 4984
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            # Pre-declared (name bluetext-file-config) so the render injection
            # mounts the rendered config.json HERE via subPath instead of its
            # default /etc/file-config; the bluetext-file-config (tmpfs) +
            # bluetext-file-config-template (ConfigMap) volumes are injected.
            - name: bluetext-file-config
              mountPath: /etc/sync_gateway/config.json
              subPath: config.json
