interfaces:
  oidc:
    port: 8443
    protocol: https
  admin:
    port: 6749
    protocol: https
connection-profiles:
  # Variant-level api-config profile (vs the oidc/jwks/introspection
  # profiles on the abstract): admin credentials are variant-bound.
  # The api-config Job uses these to call Curity's admin RESTCONF
  # ONCE the license is in place via the file-based channel below.
  api-config:
    interface: admin
    secret: variant::admin-credentials
credential-bundles:
  # Admin credentials projected to the api-config Job pod at
  # /etc/bluetext/peers/self/. The Job uses these for the post-license
  # RESTCONF surface (OAuth profiles, clients, scopes, roles).
  # Distinct from the license bootstrap (the file-config note below)
  # because the two flow through different mechanisms: license via the
  # file-config secrets:: channel, admin creds via the api-config peer
  # projection.
  admin-credentials:
    secret-keys:
      password: secrets::curity-admin-password
    literal-keys:
      # The admin username is not a secret — it sources from the values
      # catalog (see the abstract's `values:`). Only the password is a
      # Vault-backed secret.
      username: value::curity-admin-username
# License bootstrap flows through file-config, not a `mounts:` Secret.
# CRITICAL: Curity's admin RESTCONF API is gated behind a valid license —
# every endpoint returns 503 FeatureViolationException when the runtime is
# unlicensed (verified by direct probe; see reference_curity_config.md). The
# license therefore CANNOT be installed via API; Curity's only license-input
# surface is the file `/opt/idsvr/etc/init/license/default`, read by the
# startup scanner on first boot. The file-config file
# `config-files/curity/license/default` holds `$bt{{ secrets::curity-license-wrapped }}`;
# the bluetext-render init container substitutes the JSON-wrapped JWT
# (`{"License":"<jwt>"}`, stored verbatim in Vault) from the per-value-id
# `bt-secret--curity-license-wrapped` projection into the rendered tmpfs at
# pod startup. This diverges from the deferred slice-2 bundle unification
# (dennis accepted 2026-06-17): the license materialises via the per-value-id
# atom while other `mounts::` secrets stay on the old path until slice 2
# reprojects them. No security regression — both resolve the identical Vault
# path.
