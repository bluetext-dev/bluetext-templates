apiVersion: apps/v1
kind: Deployment
metadata:
  name: curity--curity
  annotations:
    # `idsvr -r` reloads etc/init XML and merges with the running config —
    # ConfD-backed dynamic reload, no process restart, no downtime. The
    # file-config reload coupling re-renders the tmpfs (re-substituting
    # secrets::) in an ephemeral bluetext-render container before the exec.
    bluetext.io/reload-command: "idsvr -r"
    bluetext.io/reload-watch: config/files/curity/curity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curity--curity
  template:
    metadata:
      labels:
        app: curity--curity
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        # The platform injects the `bluetext-render` init container here
        # (position 0): it renders config/files/curity/curity/ into the
        # bluetext-file-config tmpfs, substituting the license secrets::
        # placeholder from the projected per-value-id Secrets. The main
        # container mounts that same tmpfs at /opt/idsvr/etc/init below, so
        # idsvr reads the rendered XML init configs + license/default. The
        # namespace-stamping + base-url tokens the old config-templater did
        # via sed are now deploy::namespace / deploy::service-url.* file-config
        # placeholders resolved at render time.
        # (Never write the $bt double-brace placeholder form in a comment
        # here — the interpolation pass scans raw manifest text, not
        # comment-aware, and would try to resolve it.)
        - name: init-db-perms
          # The hsqldb-data hostPath is created by kubelet as root:root 0755,
          # but the idsvr image (init-db below AND the runtime container) runs
          # as a non-root user that must create /hsqldb/curity.lck + the schema
          # files. hostPath volumes ignore pod `fsGroup`, so the only fix is to
          # open the directory's permissions from a root container before
          # init-db runs — otherwise init-db crash-loops on
          # `curity.lck (Permission denied)`. The schema files then land owned
          # by the idsvr uid, which the runtime container (same image, same
          # uid) reads and writes.
          image: busybox:stable
          command: ["sh", "-c", "mkdir -p /hsqldb && chmod 0777 /hsqldb"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: hsqldb-data
              mountPath: /hsqldb
        - name: init-db
          # HSQLDB schema-init. Idempotent: skips when the schema file
          # already exists, so re-deploys are no-ops. The image ships
          # SqlTool + the canonical hsqldb-create_database.sql at
          # /opt/idsvr/etc/. Runs unconditionally — when Curity is wired
          # to a different datasource (Couchbase via auth/curity-couchbase
          # blueprints), the resulting schema file is unused but harmless,
          # avoiding a kustomize-overlay patch for the dev-default case.
          image: curity.azurecr.io/curity/idsvr:11.2.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -f /hsqldb/curity.script ] || ! grep -q "CREATE TABLE" /hsqldb/curity.script; then
                java -cp "/opt/idsvr/lib/hsqldb-cli/sqltool-2.7.2.jar:/opt/idsvr/lib/hsqldb-cli/hsqldb-2.7.2.jar" \
                  org.hsqldb.cmdline.SqlTool \
                  --autoCommit \
                  --inlineRc="url=jdbc:hsqldb:file:/hsqldb/curity,user=,password=" \
                  /opt/idsvr/etc/hsqldb-create_database.sql
              fi
          volumeMounts:
            - name: hsqldb-data
              mountPath: /hsqldb
      containers:
        - name: curity--curity
          image: curity.azurecr.io/curity/idsvr:11.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
              name: runtime
            - containerPort: 6749
              name: admin
          env:
            - name: PASSWORD
              value: admin
          readinessProbe:
            httpGet:
              path: /admin/alive
              port: 6749
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            # Pre-declared so the bluetext-render init-container injection
            # mounts the rendered file-config tmpfs HERE (at idsvr's init
            # dir) instead of its default /etc/file-config — the injection
            # sees the `bluetext-file-config` mount already present and skips
            # adding its own. The license can live nested at
            # /opt/idsvr/etc/init/license/default because the whole init dir
            # is one tmpfs mount (no nested-mount empty-inner-dir problem the
            # old emptyDir + separate license copy worked around).
            - name: bluetext-file-config
              mountPath: /opt/idsvr/etc/init
            - name: hsqldb-data
              mountPath: /opt/idsvr/var/hsqldb
      volumes:
        # bluetext-file-config (the rendered tmpfs), bluetext-file-config-template
        # (the file-config ConfigMap), and bluetext-secrets (the projected
        # per-value-id license Secret) are all injected by the deploy pipeline
        # alongside the bluetext-render init container.
        - name: hsqldb-data
          # Per-system hostPath so the schema survives pod restarts. Lives
          # outside the .bluetext/ cache (under the systems-dir root) so a
          # `b cache clean` doesn't wipe Curity's account/token store.
          hostPath:
            path: /var/mnt/systems/$bt{{ deploy::system-rel }}/.bluetext/curity-db
            type: DirectoryOrCreate
