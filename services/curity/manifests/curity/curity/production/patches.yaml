apiVersion: apps/v1
kind: Deployment
metadata:
  name: curity--curity
spec:
  replicas: 2
  template:
    spec:
      # No initContainers patch: the old config-templater is gone (file-config
      # render replaced it), and the injected `bluetext-render` init container
      # is added post-kustomize so an overlay can't address it here. Its image
      # is version-pinned (ghcr.io/bluetext-dev/runtime:<b-version>), so the
      # default IfNotPresent pull policy is already production-safe.
      containers:
        - name: curity--curity
          imagePullPolicy: Always
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
