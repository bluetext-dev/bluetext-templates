interfaces:
  proxy:
    port: 8000
    protocol: http
  admin:
    port: 8001
    protocol: http
credential-bundles:
  license:
    secret-keys:
      license-data: secrets::kong-enterprise-license
mounts:
  # Materialise `kong-enterprise--license` (ESO) and auto-mount it at
  # /etc/bluetext/mounts/license/ — KONG_LICENSE_PATH reads the file.
  - variant::license
