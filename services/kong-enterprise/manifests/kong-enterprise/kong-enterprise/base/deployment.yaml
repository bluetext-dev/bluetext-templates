apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-enterprise--kong-enterprise
  labels:
    app: kong-enterprise--kong-enterprise
  annotations:
    bluetext.io/reload-command: kong reload
    bluetext.io/reload-watch: config/files/kong-enterprise/kong-enterprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-enterprise--kong-enterprise
  template:
    metadata:
      labels:
        app: kong-enterprise--kong-enterprise
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: kong-enterprise--kong-enterprise
          image: kong/kong-gateway:3.12
          ports:
            - containerPort: 8000
              name: proxy
            - containerPort: 8001
              name: admin
          env:
            - name: KONG_PLUGINS
              value: "bundled"
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              # Rendered by the bluetext-render init container from the
              # file-config ConfigMap into the memory-backed tmpfs.
              value: /etc/file-config/kong.yaml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            # The enterprise license rides the `license` credential-bundle:
            # the deploy pipeline auto-mounts `kong-enterprise--license`
            # (ESO-materialized from Vault) at /etc/bluetext/mounts/license/.
            # Kong reads the license file from that path — no hand-authored
            # Secret, no cleartext in the manifest.
            - name: KONG_LICENSE_PATH
              value: /etc/bluetext/mounts/license/license-data
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: system
              mountPath: /app
      volumes:
        - name: system
          hostPath:
            path: /var/mnt/systems/$bt{{ deploy::system-rel }}/code/services/kong-enterprise
            type: DirectoryOrCreate
