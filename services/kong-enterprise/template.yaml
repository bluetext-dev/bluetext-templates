id: kong-enterprise
name: Kong Gateway Enterprise
description: Kong Gateway Enterprise 3.12 — commercial distribution with bundled EE plugins
ports:
  - 8000
  - 8001
# The enterprise license is a credential-bundle secret (declared in
# config/kong-enterprise/service.yaml + .../kong-enterprise.yaml), stored
# in Vault and materialised via ESO — not a hand-created K8s Secret. Set
# it before deploying kong-enterprise:
#   b secret set kong-enterprise-license --from-env KONG_LICENSE
