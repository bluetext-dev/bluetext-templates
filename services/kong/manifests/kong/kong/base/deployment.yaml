apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong--kong
  labels:
    app: kong--kong
  annotations:
    bluetext.io/reload-command: kong reload
    bluetext.io/reload-watch: config/files/kong/kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong--kong
  template:
    metadata:
      labels:
        app: kong--kong
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: kong--kong
          image: kong-kong:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: proxy
            - containerPort: 8001
              name: admin
          env:
            - name: KONG_PLUGINS
              value: "bundled,phantom-token"
            - name: KONG_NGINX_HTTP_LUA_SHARED_DICT
              value: "phantom-token 10m"
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              # Rendered by the bluetext-render init container from the
              # file-config ConfigMap (config/files/kong/kong/kong.yaml)
              # into the memory-backed /etc/file-config tmpfs.
              value: /etc/file-config/kong.yaml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES
              value: "cjson"
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: system
              mountPath: /app
      volumes:
        - name: system
          hostPath:
            path: /var/mnt/systems/$bt{{ deploy::system-rel }}/code/services/kong
            type: Directory
