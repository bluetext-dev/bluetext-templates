apiVersion: v1
kind: Service
metadata:
  name: web-app--web-app
spec:
  type: ClusterIP
  selector:
    app: web-app--web-app
  ports:
    # Publish the interface port directly (no :80 indirection) so the service
    # is reachable at config::links.web-app.host:config::links.web-app.port.
    - port: 5173
      targetPort: 5173
